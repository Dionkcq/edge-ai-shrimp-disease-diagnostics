name: Feature request
description: Propose a scoped improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change and its expected input/output.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and constraints
      description: Add source data, device constraints, safety implications or acceptance criteria.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not claim an unsupported disease label or definitive diagnosis.
          required: true
