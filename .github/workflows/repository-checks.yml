name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check required documentation and prohibited artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f LICENSE
          test -f datasets/DATASET_REGISTRY.md

          python scripts/check_repository_policy.py

      - name: Validate JSON metadata
        run: python -m json.tool datasets/source-notes/dataset_manifest.json >/dev/null
