name: Backend and data checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "pipeline/**"
      - "policy/**"
      - "guidance/**"
      - "models/**"
      - "contracts/**"
      - "scripts/**"
      - "datasets/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/backend-data.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-data-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python workspace
        run: |
          uv python install 3.13
          uv sync --locked --all-packages --all-groups

      - name: Ruff
        run: |
          uv run ruff check backend pipeline scripts
          uv run ruff format --check backend pipeline scripts

      - name: Strict mypy
        run: uv run mypy backend/src pipeline/src scripts

      - name: Full branch-coverage suite
        run: >-
          uv run pytest
          --cov=backend/src/shrimp_screening
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Contract schema drift
        run: uv run pytest backend/tests/contract/test_schema_drift.py -q

      - name: Runtime licence boundary
        run: uv run python scripts/check_no_agpl_in_runtime.py

      - name: Tracked-file policy
        run: uv run python scripts/check_repository_policy.py
