name: Frontend and production browser checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "contracts/**"
      - "policy/**"
      - "guidance/**"
      - "models/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/frontend-checks.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python workspace
        run: |
          uv python install 3.13
          uv sync --locked --all-packages --all-groups

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Static, unit, contract and offline checks
        working-directory: frontend
        run: npm run check

      - name: Install Chromium with system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile against production FastAPI serving
        working-directory: frontend
        run: npm run test:e2e

      - name: Audit frontend production and development dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
