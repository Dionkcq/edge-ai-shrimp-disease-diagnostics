# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Development-time data tooling. This package is NEVER imported by the backend;
# `backend/tests/security/test_dependency_boundary.py` asserts the boundary.
#
# The training toolchain (ultralytics, torch) is deliberately NOT declared here.
# It lives in the separately locked Python 3.11 `training/` project. Declaring it
# here would pull AGPL tooling into the workspace lockfile that resolves the MIT
# runtime. `shrimp-pipeline train` remains unavailable by design; use `shrimp-train`.
[project]
name = "shrimp-pipeline"
version = "0.1.0"
description = "Offline data audit, mapping-gate and conversion tooling for the shrimp datasets"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-or-later"
authors = [{ name = "OIP Group One" }]
dependencies = [
    "pillow>=11.0",
    "numpy>=2.1",
]

[project.scripts]
shrimp-pipeline = "shrimp_pipeline.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shrimp_pipeline"]
